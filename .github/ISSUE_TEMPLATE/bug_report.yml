name: 🐛 Bug Report
description: Create a report to help us improve Reyhan Commerce
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you have tested against the latest release.
  - type: input
    id: version
    attributes:
      label: Reyhan Version
      description: What version of Reyhan / core package are you running?
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: input
    id: php_version
    attributes:
      label: PHP Version
      description: What version of PHP are you running?
      placeholder: "e.g. 8.4.1"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. In this environment...
        2. With this action / API request...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Stacktrace
      description: Paste any relevant logs or stacktraces.
      render: shell
